<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNG Narrador</title>
<style>
  :root { --bg:#16161c; --panel:#20202a; --line:#33333f; --text:#eee; --muted:#9a9aab; --acc:#7c5cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; display:flex; min-height:100vh; }
  aside { width:330px; background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow-y:auto; max-height:100vh; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:12px; }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 0 8px; }
  label { display:block; margin:6px 0; }
  .file { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px; border:1px dashed var(--line); border-radius:8px; margin-bottom:6px; }
  .file small { color:var(--muted); display:block; }
  .file input { width:110px; font-size:11px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  input[type=range] { width:100%; }
  select, button { width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:#2a2a36; color:var(--text); font:inherit; }
  button { cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); font-weight:600; }
  .row { display:flex; gap:8px; }
  canvas { max-width:100%; max-height:75vh; border-radius:8px; background:
    repeating-conic-gradient(#2a2a33 0 25%, #1e1e26 0 50%) 0 0/24px 24px; }
  #meter { width:min(640px,100%); height:10px; background:#2a2a36; border-radius:5px; overflow:hidden; position:relative; }
  #meterFill { height:100%; width:0; background:#4caf50; }
  #meterThr { position:absolute; top:0; bottom:0; width:2px; background:#fff; }
  #status { color:var(--muted); }
  @media (max-width:800px){ body{flex-direction:column} aside{width:100%;max-height:none} }
</style>
</head>
<body>
<aside>
  <h1>🎙️ PNG Narrador</h1>

  <h2>1. Imagens</h2>
  <div class="file"><div>Boca fechada<small>obrigatório</small></div><input type="file" accept="image/*" data-img="idle"></div>
  <div class="file"><div>Boca aberta<small>opcional</small></div><input type="file" accept="image/*" data-img="talk"></div>
  <div class="file"><div>Piscando (fechada)<small>opcional</small></div><input type="file" accept="image/*" data-img="blinkIdle"></div>
  <div class="file"><div>Piscando (aberta)<small>opcional</small></div><input type="file" accept="image/*" data-img="blinkTalk"></div>
  <div class="file"><div>Grito / voz alta<small>opcional</small></div><input type="file" accept="image/*" data-img="shout"></div>

  <h2>2. Narração</h2>
  <div class="file"><div>Áudio<small>MP3, WAV, M4A…</small></div><input type="file" accept="audio/*" id="audioFile"></div>

  <label>Idioma da narração
    <select id="lang">
      <option value="pt">Português</option>
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="de">Deutsch</option>
      <option value="nl">Nederlands</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
    </select>
  </label>

  <h2>3. Animações</h2>
  <div class="grid">
    <label><input type="checkbox" data-anim="bounce" checked> Pulo</label>
    <label><input type="checkbox" data-anim="squash" checked> Esticar/amassar</label>
    <label><input type="checkbox" data-anim="sway"> Balanço</label>
    <label><input type="checkbox" data-anim="tilt"> Inclinar</label>
    <label><input type="checkbox" data-anim="zoom"> Zoom na fala</label>
    <label><input type="checkbox" data-anim="shake" checked> Tremer no grito</label>
    <label><input type="checkbox" data-anim="breathe" checked> Respirar parado</label>
    <label><input type="checkbox" data-anim="glow"> Brilho ao falar</label>
  </div>
  <label>Intensidade <input type="range" id="intensity" min="0.2" max="3" step="0.1" value="1"></label>
  <label>Sensibilidade do microfone <input type="range" id="threshold" min="0.01" max="0.3" step="0.005" value="0.06"></label>
  <label>Limite de "grito" <input type="range" id="shoutThr" min="0.1" max="0.8" step="0.01" value="0.35"></label>

  <h2>4. Vídeo</h2>
  <label>Fundo
    <select id="bg">
      <option value="#00ff00">Verde (chroma key)</option>
      <option value="#0000ff">Azul (chroma key)</option>
      <option value="#ff00ff">Magenta (chroma key)</option>
      <option value="#ffffff">Branco</option>
      <option value="#000000">Preto</option>
    </select>
  </label>
  <label>Resolução
    <select id="res">
      <option value="1080x1080">1080 × 1080 (quadrado)</option>
      <option value="1920x1080">1920 × 1080 (horizontal)</option>
      <option value="1080x1920">1080 × 1920 (vertical)</option>
      <option value="720x720">720 × 720</option>
    </select>
  </label>
  <label>FPS
    <select id="fps"><option>30</option><option>60</option><option>24</option></select>
  </label>
  <label>Posição
    <select id="anchor">
      <option value="bottom">Encostado embaixo (busto)</option>
      <option value="center">Centralizado</option>
    </select>
  </label>
  <label>Tamanho do personagem <input type="range" id="scale" min="0.3" max="1.2" step="0.01" value="0.85"></label>
</aside>

<main>
  <canvas id="c" width="1080" height="1080"></canvas>
  <div id="meter"><div id="meterFill"></div><div id="meterThr"></div></div>
  <div class="row" style="width:min(640px,100%)">
    <button id="play">▶ Pré-visualizar</button>
    <button id="stop">■ Parar</button>
    <button id="record" class="primary">⚡ Exportar MP4</button>
  </div>
  <div id="status">Carregue um PNG e um áudio para começar.</div>
</main>


<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
<script>
// Perfis por idioma: quanto a boca reage (attack/release) e quanto tempo "segura" aberta (hold, ms).
// Idiomas silábicos rápidos (ja, es, it, ko) reagem mais ágil; alemão/holandês têm consoantes
// longas, então seguramos um pouco mais para a boca não "piscar".
const LANG = {
  pt:{attack:.55, release:.25, hold:70},  es:{attack:.65, release:.32, hold:55},
  en:{attack:.55, release:.25, hold:70},  fr:{attack:.55, release:.22, hold:80},
  it:{attack:.65, release:.30, hold:55},  de:{attack:.50, release:.20, hold:90},
  nl:{attack:.50, release:.20, hold:90},  ja:{attack:.70, release:.35, hold:45},
  ko:{attack:.65, release:.32, hold:50},
};
const BIN_MS = 10; // resolução do mapa de volume

const $ = s => document.querySelector(s);
const canvas = $('#c'), ctx = canvas.getContext('2d');
const imgs = {};
let audioEl = null, audioBuf = null, levels = null, playing = false, exporting = false;

function status(t){ $('#status').textContent = t; }
const anim = k => document.querySelector(`[data-anim="${k}"]`).checked;

// --- carregamento ---
document.querySelectorAll('[data-img]').forEach(inp => inp.onchange = () => {
  const f = inp.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => { imgs[inp.dataset.img] = im; preview(); status('Imagem carregada.'); };
  im.src = URL.createObjectURL(f);
});

$('#audioFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  stop();
  status('Analisando áudio…');
  audioEl = new Audio(URL.createObjectURL(f));
  const actx = new AudioContext();
  audioBuf = await actx.decodeAudioData(await f.arrayBuffer());
  actx.close();
  levels = analyze(audioBuf);
  status(`Áudio pronto: ${f.name} (${audioBuf.duration.toFixed(1)} s)`);
};

// Volume (RMS) do áudio inteiro, calculado uma única vez — é isso que torna a exportação rápida.
function analyze(buf){
  const sr = buf.sampleRate, bin = Math.round(sr * BIN_MS / 1000), win = bin * 2;
  const ch = [...Array(buf.numberOfChannels)].map((_, i) => buf.getChannelData(i));
  const n = Math.ceil(buf.length / bin), out = new Float32Array(n);
  for (let b = 0; b < n; b++) {
    const start = Math.max(0, b*bin - bin/2|0), end = Math.min(buf.length, start + win);
    let s = 0;
    for (let i = start; i < end; i++) { let v = 0; for (const c of ch) v += c[i]; v /= ch.length; s += v*v; }
    out[b] = Math.sqrt(s / Math.max(1, end - start));
  }
  return out;
}
const levelAt = t => levels ? (levels[Math.floor(t / BIN_MS)] || 0) : 0;

$('#res').onchange = () => { const [w,h] = $('#res').value.split('x').map(Number); canvas.width=w; canvas.height=h; preview(); };
['#bg','#scale','#anchor'].forEach(s => $(s).oninput = preview);
$('#threshold').oninput = () => { $('#meterThr').style.left = Math.min(100, $('#threshold').value*250)+'%'; };
$('#threshold').oninput();

// --- animação (determinística a partir do tempo, serve para prévia e exportação) ---
const newState = () => ({ level:0, lastLoud:-1e9, phase:0, prevT:0, talking:false, blinkUntil:0, nextBlink:2500 });

function drawFrame(t, raw, st){
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = $('#bg').value; ctx.fillRect(0,0,W,H);
  const base = imgs.idle; if (!base) return;

  const p = LANG[$('#lang').value], I = +$('#intensity').value, thr = +$('#threshold').value;
  const dt = Math.max(0, t - st.prevT); st.prevT = t;
  const k = Math.min(1, dt / 16.7); // normaliza suavização para qualquer FPS
  st.level += (raw - st.level) * (raw > st.level ? p.attack : p.release) * k;
  if (st.level > thr) st.lastLoud = t;
  const wasTalking = st.talking;
  st.talking = (t - st.lastLoud) < p.hold;
  const talking = st.talking, shouting = talking && st.level > +$('#shoutThr').value;
  if (talking && !wasTalking) st.phase = 0;      // cada frase nova começa com um pulinho
  if (talking) st.phase += dt * 0.015;

  if (t > st.nextBlink) { st.blinkUntil = t + 130; st.nextBlink = t + 2000 + Math.random()*4000; }
  const blinking = t < st.blinkUntil;

  let im;
  if (shouting && imgs.shout) im = imgs.shout;
  else if (talking) im = (blinking && imgs.blinkTalk) || imgs.talk || base;
  else im = (blinking && imgs.blinkIdle) || base;

  const amt = Math.min(1, st.level / Math.max(thr*3, .01)) * I;
  let dx=0, dy=0, rot=0, sx=1, sy=1;
  if (anim('bounce') && talking) dy -= Math.abs(Math.sin(st.phase)) * 30 * amt;
  if (anim('squash') && talking) { const q = Math.sin(st.phase)*0.04*amt; sx -= q; sy += q; }
  if (anim('sway')) dx += Math.sin(t/600) * 12 * I * (talking?1.5:0.6);
  if (anim('tilt')) rot += Math.sin(t/900) * 0.035 * I * (talking?1.4:0.6);
  if (anim('zoom') && talking) { sx += 0.05*amt; sy += 0.05*amt; }
  if (anim('shake') && shouting) { dx += (Math.random()-.5)*14*I; dy += (Math.random()-.5)*14*I; }
  if (anim('breathe') && !talking) { const b = Math.sin(t/700)*0.012*I; sy += b; sx -= b/2; }

  const fit = Math.min(W / base.width, H / base.height) * +$('#scale').value;
  const w = im.width*fit, h = im.height*fit;
  const baseY = $('#anchor').value === 'bottom' ? H + 4 : H - (H-h)/2; // +4 esconde a borda do corte
  ctx.save();
  ctx.translate(W/2 + dx, baseY + dy);
  ctx.rotate(rot); ctx.scale(sx, sy);
  if (anim('glow') && talking) { ctx.shadowColor='#fff'; ctx.shadowBlur=40*amt; }
  ctx.drawImage(im, -w/2, -h, w, h);
  ctx.restore();
  return { level: st.level, talking, shouting };
}

function meter(r, frac){
  const f = $('#meterFill');
  if (frac != null) { f.style.width = (frac*100)+'%'; f.style.background = '#7c5cff'; return; }
  f.style.width = Math.min(100, (r ? r.level : 0)*250)+'%';
  f.style.background = r && r.shouting ? '#ff5252' : r && r.talking ? '#4caf50' : '#666';
}
function preview(){ if (!playing && !exporting) drawFrame(0, 0, newState()); }

// --- prévia em tempo real ---
let pst;
function loop(){
  if (!playing) return;
  const t = audioEl.currentTime * 1000;
  meter(drawFrame(t, levelAt(t), pst));
  requestAnimationFrame(loop);
}
async function play(){
  if (exporting) return;
  if (!imgs.idle) return status('Carregue pelo menos o PNG de boca fechada.');
  if (!levels) return status('Carregue o áudio da narração.');
  pst = newState(); audioEl.currentTime = 0; await audioEl.play();
  playing = true; requestAnimationFrame(loop);
  audioEl.onended = () => { playing = false; meter(null); status('Fim da prévia.'); };
  status('Pré-visualizando…');
}
function stop(){ playing = false; if (audioEl) audioEl.pause(); meter(null); }
$('#play').onclick = play;
$('#stop').onclick = () => { stop(); status('Parado.'); };

// --- exportação rápida: renderiza quadro a quadro (sem esperar o tempo real) e codifica em MP4 ---
async function pickVideoCodec(W, H, fps){
  // H.264 primeiro (abre em qualquer editor); VP9 como reserva para navegadores sem H.264.
  for (const [codec, mux] of [['avc1.640033','avc'],['avc1.4d0033','avc'],['avc1.42003e','avc'],['vp09.00.40.08','vp9']]) {
    const cfg = { codec, width:W, height:H, framerate:fps, bitrate: W*H*fps*0.15, ...(mux==='avc' && {avc:{format:'avc'}}) };
    if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { cfg, mux };
  }
  throw new Error('Este navegador não consegue codificar vídeo.');
}
async function pickAudioCodec(buf){
  const base = { sampleRate: buf.sampleRate, numberOfChannels: Math.min(2, buf.numberOfChannels), bitrate: 192000 };
  for (const [codec, mux] of [['mp4a.40.2','aac'], ['opus','opus']]) {
    const cfg = { ...base, codec };
    if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { cfg, mux };
  }
  throw new Error('Este navegador não consegue codificar o áudio.');
}

$('#record').onclick = async () => {
  if (exporting) return;
  if (!imgs.idle || !levels) return status('Carregue imagem e áudio primeiro.');
  if (!window.VideoEncoder || !window.Mp4Muxer) return status('Use Chrome ou Edge atualizados (precisa de WebCodecs e internet na 1ª vez).');
  stop(); exporting = true;
  const t0 = performance.now();
  try {
    const W = canvas.width, H = canvas.height, fps = +$('#fps').value;
    const { cfg: vcfg, mux: vmux } = await pickVideoCodec(W, H, fps);
    const { cfg: acfg, mux: amux } = await pickAudioCodec(audioBuf);
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec:vmux, width:W, height:H, frameRate:fps },
      audio: { codec:amux, sampleRate:acfg.sampleRate, numberOfChannels:acfg.numberOfChannels },
      fastStart: 'in-memory',
    });
    let err = null;
    const venc = new VideoEncoder({ output:(c,m)=>muxer.addVideoChunk(c,m), error:e=>err=e });
    const aenc = new AudioEncoder({ output:(c,m)=>muxer.addAudioChunk(c,m), error:e=>err=e });
    venc.configure(vcfg); aenc.configure(acfg);

    // áudio
    const sr = audioBuf.sampleRate, nch = acfg.numberOfChannels, CH = 4096;
    const chans = [...Array(nch)].map((_, i) => audioBuf.getChannelData(i));
    for (let off = 0; off < audioBuf.length; off += CH) {
      const n = Math.min(CH, audioBuf.length - off), data = new Float32Array(n * nch);
      chans.forEach((c, i) => data.set(c.subarray(off, off + n), i * n));
      const ad = new AudioData({ format:'f32-planar', sampleRate:sr, numberOfFrames:n, numberOfChannels:nch, timestamp:Math.round(off/sr*1e6), data });
      aenc.encode(ad); ad.close();
    }

    // vídeo
    const total = Math.ceil(audioBuf.duration * fps), st = newState(), dur = Math.round(1e6/fps);
    for (let i = 0; i < total; i++) {
      if (err) throw err;
      const t = i * 1000 / fps;
      drawFrame(t, levelAt(t), st);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(i*1e6/fps), duration: dur });
      venc.encode(frame, { keyFrame: i % (fps*2) === 0 }); frame.close();
      if (venc.encodeQueueSize > 12) await new Promise(r => venc.addEventListener('dequeue', r, { once:true }));
      if (i % 20 === 0) { meter(null, i/total); status(`Renderizando… ${Math.round(i/total*100)}%`); await new Promise(r => setTimeout(r)); }
    }
    await Promise.all([venc.flush(), aenc.flush()]);
    if (err) throw err;
    muxer.finalize();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([muxer.target.buffer], { type:'video/mp4' }));
    a.download = 'personagem-falando.mp4'; a.click();
    const secs = (performance.now() - t0) / 1000;
    status(`MP4 exportado em ${secs.toFixed(1)} s (${audioBuf.duration.toFixed(1)} s de vídeo) ✅`);
  } catch (e) {
    console.error(e); status('Erro na exportação: ' + e.message);
  } finally {
    exporting = false; meter(null); preview();
  }
};
</script>
</body>
</html>
